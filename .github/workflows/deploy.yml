name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; finish the running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # build-versions.mjs checks out earlier commits into git worktrees, so the full
          # history is required — the default shallow clone cannot reach v1 and v2.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The test suite gates the deploy on purpose: this is an engineering calculator, and
      # shipping one whose unit tests fail is worse than not shipping.
      - run: npm test

      # Publishes every version side by side: / and /v3/ are the latest, /v1/ and /v2/ are
      # the earlier releases built from their own commits and lockfiles.
      - run: node scripts/build-versions.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-all

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
